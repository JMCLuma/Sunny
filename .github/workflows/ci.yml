name: CI

# Sunny is the Luma 2.0 demo wireframe: no deploys, no Supabase, no secrets.
# These are the same checks a contributor runs locally.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run build
